<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Тестова карта для DCCC</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">

<style>
body, html { margin:0; padding:0; height:100%; font-family:'Google Sans', sans-serif; overflow:hidden; }
#map { width:100%; height:100%; }

#dark-overlay {
  position:absolute;
  inset:0;
  background:rgba(34,37,36,0.16);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
  z-index:900;
}

#dark-overlay.active {
  opacity:1;
  pointer-events:auto;
  backdrop-filter: blur(1.5px);
  -webkit-backdrop-filter: blur(1.5px);
}

#info-panel {
  position:absolute;
  top:0; left:0;
  width:min(640px, 46%);
  height:100%;
  display:flex;
  flex-direction:column;
  background:#ffffff;
  border-right:1px solid #e0e0e0;
  transform:translateX(-100%);
  transition:transform .32s ease, opacity .32s ease;
  opacity:0;
  pointer-events:none;
  z-index:1010;
  overflow:hidden;
}

#info-panel.active {
  transform:translateX(0);
  opacity:1;
  pointer-events:auto;
}

#info-close {
  position:absolute;
  top:18px;
  right:18px;
  cursor:pointer;
  font-size:18px;
  color:#555;
  line-height:1;
  z-index:1;
  transition:color .15s ease;
  user-select:none;
}

#info-close:hover {
  color:#000;
}

#info-content {
  flex:1;
  overflow-y:auto;
  padding:56px 40px 40px;
}

#info-title {
  margin:0 0 36px;
  padding-right:36px;
  color:#1a1a1a;
  font-size:32px;
  font-weight:700;
  letter-spacing:-0.03em;
  line-height:1.15;
}

#info-meta-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px 32px;
  margin-bottom:36px;
  padding-bottom:32px;
  border-bottom:1px solid #ebebeb;
}

.meta-label {
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  color:#aaa;
  margin-bottom:5px;
  letter-spacing:0.06em;
}

.meta-value {
  font-size:15px;
  color:#1a1a1a;
  line-height:1.45;
}

#info-description {
  font-size:15px;
  color:#444;
  line-height:1.75;
  white-space:pre-line;
  overflow-wrap:break-word;
  word-break:break-word;
}

#info-image-strip {
  flex-shrink:0;
  position:relative;
  height:30vh;
  overflow:hidden;
}

#info-strip-img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

#info-img-caption {
  position:absolute;
  bottom:0; left:0; right:0;
  padding:8px 14px;
  background:rgba(0,0,0,0.45);
  color:#fff;
  font-size:11px;
  line-height:1.4;
}

@media (max-width:800px) {
  #info-panel {
    width:100%;
    height:min(60dvh, 480px);
    max-height:60dvh;
    border-right:none;
    border-bottom:1px solid #e0e0e0;
    transform:translateY(-100%);
  }

  #info-content { padding:44px 24px 28px; }
  #info-panel.active { transform:translateY(0); }
  #info-title { font-size:24px; margin-bottom:24px; }
  #info-image-strip { height:15vh; }
}

/* === ПОШУК === */
#search-bar {
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  width:min(400px, calc(100% - 280px));
  background:#fff;
  border-radius:28px;
  box-shadow:0 2px 12px rgba(0,0,0,0.14);
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:8px;
  z-index:1000;
}

#search-icon {
  color:#aaa;
  font-size:14px;
  flex-shrink:0;
}

#search-input {
  border:none;
  outline:none;
  font-family:inherit;
  font-size:14px;
  flex:1;
  height:42px;
  background:transparent;
  color:#1a1a1a;
}

#search-input::placeholder { color:#bbb; }

#search-clear {
  cursor:pointer;
  color:#aaa;
  font-size:14px;
  flex-shrink:0;
  user-select:none;
  transition:color .15s;
}

#search-clear:hover { color:#555; }

#search-results {
  position:absolute;
  top:calc(100% + 6px);
  left:0; right:0;
  background:#fff;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,0.12);
  overflow:hidden;
  max-height:320px;
  overflow-y:auto;
}

.search-result-item {
  padding:12px 16px;
  cursor:pointer;
  border-bottom:1px solid #f0f0f0;
  display:flex;
  flex-direction:column;
  gap:3px;
  transition:background .12s;
}

.search-result-item:last-child { border-bottom:none; }
.search-result-item:hover { background:#f7f7f7; }

.search-result-title {
  font-size:14px;
  font-weight:600;
  color:#1a1a1a;
}

.search-result-sub {
  font-size:12px;
  color:#888;
}

.search-result-item.no-results {
  color:#aaa;
  font-size:14px;
  padding:14px 16px;
  cursor:default;
}

.search-result-item.no-results:hover { background:transparent; }

@media (max-width:800px) {
  #search-bar {
    width:calc(100% - 32px);
    border-radius:20px;
  }
}

/* === ЛЕГЕНДА === */
.map-legend {
  position:absolute;
  top:10px;
  right:10px;
  z-index:1000;
  min-width:200px;
  padding:14px 16px;
  color:#1a1a1a;
  background:#fff;
  border-radius:16px;
  box-shadow:0 2px 12px rgba(0,0,0,0.12);
  max-height:calc(100vh - 20px);
  overflow-y:auto;
}

.map-legend-title {
  margin-bottom:12px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:#aaa;
}

.map-legend-item {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  cursor:pointer;
  font-size:13px;
  color:#333;
  transition:opacity .2s;
}

.map-legend-item:last-child { margin-bottom:0; }

.map-legend-item:not(.active) {
  opacity:0.35;
}

.map-legend-marker {
  width:24px;
  height:24px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:10px;
}

</style>
</head>

<body>

<div id="map"></div>
<div id="dark-overlay"></div>

<div id="search-bar">
  <i class="fa-solid fa-magnifying-glass" id="search-icon"></i>
  <input id="search-input" type="text" placeholder="Пошук об'єктів..." autocomplete="off" />
  <div id="search-clear" hidden>✕</div>
  <div id="search-results" hidden></div>
</div>
<div class="map-legend" id="legend" style="display:none">
  <div class="map-legend-title">Фільтр</div>
  <div id="legend-items"></div>
</div>

<div id="info-panel">
  <div id="info-close">✕</div>
  <div id="info-content">
    <h1 id="info-title"></h1>
    <div id="info-meta-grid"></div>
    <div id="info-description"></div>
  </div>
  <div id="info-image-strip" hidden>
    <img id="info-strip-img" alt="" />
    <div id="info-img-caption"></div>
  </div>
</div>

<script>
const map = new maplibregl.Map({
  container: 'map',
  style: './styles/minimal-light.json',
  center: [35.0572, 48.4648],
  zoom: 16
});

map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

const infoPanel = document.getElementById('info-panel');
const darkOverlay = document.getElementById('dark-overlay');
const infoTitle = document.getElementById('info-title');
const infoMetaGrid = document.getElementById('info-meta-grid');
const infoDescription = document.getElementById('info-description');
const infoImageStrip = document.getElementById('info-image-strip');
const infoStripImg = document.getElementById('info-strip-img');
const infoImgCaption = document.getElementById('info-img-caption');
const infoClose = document.getElementById('info-close');
const legend = document.getElementById('legend');
const legendItems = document.getElementById('legend-items');
let activePanelType = null;

/* =======================
   TYPE CONFIG
======================= */
const TYPE_MAP = {
  cultural_center:  { icon: 'fa-solid fa-landmark', color: '#8B7EC8' },
  theatre:          { icon: 'fa-solid fa-masks-theater', color: '#C87E8B' },
  museum:           { icon: 'fa-solid fa-building-columns', color: '#7EA8C8' },
  cinema:           { icon: 'fa-solid fa-film', color: '#C8A87E' },
  library:          { icon: 'fa-solid fa-book-open', color: '#7EC8A8' },
  arts_center:      { icon: 'fa-solid fa-palette', color: '#C8C87E' },
  nightclub:        { icon: 'fa-solid fa-music', color: '#B87EC8' },
  music_school:     { icon: 'fa-solid fa-guitar', color: '#C8957E' },
  "art gallery":    { icon: 'fa-solid fa-paintbrush', color: '#7EC8C8' },
  community_center: { icon: 'fa-solid fa-people-roof', color: '#8BC878' },
  education_center: { icon: 'fa-solid fa-graduation-cap', color: '#78A8C8' },
  art_studio:       { icon: 'fa-solid fa-paintbrush', color: '#7EC8C8' }
};

const TYPE_LABELS = {
  cultural_center: "Культурний центр",
  theatre: "Театр",
  museum: "Музей",
  cinema: "Кінотеатр",
  library: "Бібліотека",
  arts_center: "Мистецький центр",
  nightclub: "Нічний клуб",
  music_school: "Музична школа",
  "art gallery": "Артгалерея",
  community_center: "Громадський центр",
  education_center: "Освітній центр",
  art_studio: "Артстудія"
};

const activeTypes = new Set();
let allPoints = [];

/* =======================
   PARSE
======================= */
function parseCoord(value) {
  if (!value) return null;
  let s = String(value).replace(',', '.').replace(/[^0-9.\-]/g,'');
  const num = parseFloat(s);
  return isNaN(num) ? null : num;
}

/* =======================
   DATA
======================= */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1kOzR-QWaQoam2Rs6Ot_6rOHfEBG2q-TZlwGoB4IGJhI/gviz/tq?tqx=out:json";

map.on('load', () => {
  addDniproBoundary();

  fetch(SHEET_URL)
    .then(res => res.text())
    .then(text => {
      const json = JSON.parse(text.substring(47).slice(0,-2));
      const rows = json.table.rows;

      const points = rows.map(r=>{
        const lat = parseCoord(r.c[0]?.v);
        const lng = parseCoord(r.c[1]?.v);
        if(lat===null || lng===null) return null;

        return {
          coords:[lng,lat],
          title:r.c[2]?.v||"",
          image:r.c[3]?.v||"",
          text:r.c[4]?.v||"",
          author:String(r.c[5]?.v||""),
          year:String(r.c[6]?.v||""),
          type:String(r.c[7]?.v||"").toLowerCase().trim(),
          address:String(r.c[8]?.v||""),
          status:String(r.c[9]?.v||"")
        };
      }).filter(Boolean);

      allPoints = points;
      addPointsLayer(points);
      renderLegend();
      legend.style.display = 'block';
    })
    .catch(err => console.error('Помилка завантаження даних:', err));
});

/* =======================
   DNIPRO BOUNDARY
======================= */
function addDniproBoundary() {
  map.addSource('dnipro-boundary', {
    type: 'geojson',
    data: './data/dnipro-boundary.geojson'
  });

  map.addLayer({
    id: 'dnipro-boundary-fill',
    type: 'fill',
    source: 'dnipro-boundary',
    paint: {
      'fill-color': '#8fbfbd',
      'fill-opacity': 0
    }
  });

  map.addLayer({
    id: 'dnipro-boundary-line',
    type: 'line',
    source: 'dnipro-boundary',
    paint: {
      'line-color': '#ababab',
      'line-width': ['interpolate', ['linear'], ['zoom'], 9, 1.2, 13, 2, 16, 3.2],
      // 'line-dasharray': [2, 1.2],
      'line-opacity': 0.9,
    }
  });
}

/* =======================
   MARKERS (GL layer)
======================= */
function addPointsLayer(points) {
  const geojson = {
    type: 'FeatureCollection',
    features: points.map((p, idx) => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: p.coords },
      properties: {
        idx,
        type: p.type,
        color: TYPE_MAP[p.type]?.color || '#888',
        title: p.title
      }
    }))
  };

  map.addSource('points', { type: 'geojson', data: geojson });

  map.addLayer({
    id: 'points-layer',
    type: 'circle',
    source: 'points',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 10, 14, 14, 17, 16],
      'circle-color': ['get', 'color'],
      'circle-stroke-width': 0,
      'circle-opacity': 0.92
    }
  });
}

/* =======================
   INFO PANEL
======================= */
function openPanel(p) {
  activePanelType = p.type || 'other';

  infoTitle.textContent = p.title;

  infoMetaGrid.innerHTML = '';
  const typeLabel = TYPE_LABELS[p.type] || p.type || '';
  [
    ['Рік', p.year],
    ['Тип', typeLabel],
    ['Адреса', p.address],
    ['Статус', p.status]
  ].forEach(([label, value]) => {
    const item = document.createElement('div');
    item.className = 'meta-item';
    item.innerHTML = `<div class="meta-label">${label}</div><div class="meta-value">${value || '—'}</div>`;
    infoMetaGrid.appendChild(item);
  });

  infoDescription.innerHTML = p.text || '';

  if (p.image) {
    infoStripImg.src = p.image;
    infoImgCaption.textContent = p.title;
    infoImageStrip.hidden = false;
  } else {
    infoImageStrip.hidden = true;
  }

  infoPanel.classList.add('active');
  darkOverlay.classList.add('active');
}

function closePanel() {
  infoPanel.classList.remove('active');
  darkOverlay.classList.remove('active');
  activePanelType = null;
}

infoClose.onclick = closePanel;
darkOverlay.onclick = closePanel;
map.on('click', e => {
  const hits = map.queryRenderedFeatures(e.point, { layers: ['points-layer'] });
  if (hits.length === 0) closePanel();
});
map.on('click', 'points-layer', e => {
  const p = allPoints[e.features[0].properties.idx];
  openPanel(p);
  map.flyTo({
    center: p.coords,
    zoom: map.getZoom() < 15 ? 16 : map.getZoom(),
    speed: 1.2,
    padding: { left: infoPanel.offsetWidth, top: 0, right: 0, bottom: 0 }
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
});

map.on('mouseenter', 'points-layer', () => { map.getCanvas().style.cursor = 'pointer'; });
map.on('mouseleave', 'points-layer', () => { map.getCanvas().style.cursor = ''; });

/* =======================
   CLICKABLE LEGEND
======================= */
function renderLegend() {
  legendItems.innerHTML = '';
  activeTypes.clear();

  const presentTypes = [...new Set(allPoints.map(p => p.type).filter(Boolean))];

  presentTypes.forEach(type => {
    const typeData = TYPE_MAP[type] || {};
    const color = typeData.color || '#888';
    const label = TYPE_LABELS[type] || type;

    activeTypes.add(type);

    const item = document.createElement('div');
    item.className = 'map-legend-item active';
    item.dataset.type = type;
    item.innerHTML = `
      <div class="map-legend-marker" style="background:${color}"></div>
      <div>${label}</div>
    `;

    item.addEventListener('click', event => {
      event.stopPropagation();
      const isActive = item.classList.contains('active');

      if (isActive) activeTypes.delete(type); else activeTypes.add(type);

      map.setFilter('points-layer', [
        'in', ['get', 'type'], ['literal', [...activeTypes]]
      ]);

      if (isActive && activePanelType === type) closePanel();
      item.classList.toggle('active');
    });

    legendItems.appendChild(item);
  });
}
/* =======================
   SEARCH
======================= */
const searchBar = document.getElementById('search-bar');
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
const searchResults = document.getElementById('search-results');

function stripHtml(str) {
  return str.replace(/<[^>]*>/g, ' ');
}

function searchPoints(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  return allPoints.filter(p =>
    p.title.toLowerCase().includes(q) ||
    stripHtml(p.text).toLowerCase().includes(q)
  );
}

function renderSearchResults(results) {
  searchResults.innerHTML = '';

  if (results.length === 0) {
    const item = document.createElement('div');
    item.className = 'search-result-item no-results';
    item.textContent = 'Нічого не знайдено';
    searchResults.appendChild(item);
  } else {
    results.forEach(p => {
      const item = document.createElement('div');
      item.className = 'search-result-item';
      const label = TYPE_LABELS[p.type] || p.type || '';
      item.innerHTML = `
        <div class="search-result-title">${p.title}</div>
        ${label ? `<div class="search-result-sub">${label}</div>` : ''}
      `;
      item.addEventListener('click', () => {
        openPanel(p);
        map.flyTo({
          center: p.coords,
          zoom: 17,
          speed: 1.4,
          padding: { left: infoPanel.offsetWidth, top: 0, right: 0, bottom: 0 }
        });
        closeSearchResults();
        searchInput.value = '';
        searchClear.hidden = true;
      });
      searchResults.appendChild(item);
    });
  }

  searchResults.hidden = false;
}

function closeSearchResults() {
  searchResults.hidden = true;
}

searchInput.addEventListener('input', () => {
  const val = searchInput.value;
  if (!val.trim()) {
    closeSearchResults();
    searchClear.hidden = true;
    return;
  }
  searchClear.hidden = false;
  renderSearchResults(searchPoints(val));
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.hidden = true;
  closeSearchResults();
  searchInput.focus();
});

document.addEventListener('click', e => {
  if (!searchBar.contains(e.target)) closeSearchResults();
});
</script>

</body>
</html>
